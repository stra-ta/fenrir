<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Fenrir campaign loop</title>
  <desc id="desc">A search strategy proposes a workload genome, a runner sends it to a target adapter, observations are scored and stored, and the result informs the next proposal.</desc>
  <defs>
    <style>
      .canvas { fill: #0b0f14; }
      .title { fill: #f1f5f9; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #94a3b8; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group { fill: #88c0d0; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .node { fill: #151c25; stroke: #2e3440; stroke-width: 2; }
      .number { fill: #d9b86c; font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .label { fill: #f1f5f9; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #aab4c3; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #d9b86c; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #d9b86c; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9b86c"/>
    </marker>
  </defs>
  <rect class="canvas" width="1200" height="420"/>
  <text class="title" x="60" y="58">Fenrir campaign loop</text>
  <text class="subtitle" x="60" y="86">Search stays separate from target execution and stored evidence.</text>
  <text class="group" x="60" y="132">PROPOSE</text>
  <text class="group" x="510" y="132">EXECUTE</text>
  <text class="group" x="930" y="132">OBSERVE</text>
  <rect class="node" x="60" y="155" width="190" height="112" rx="10"/>
  <text class="number" x="82" y="183">01</text>
  <text class="label" x="82" y="213">Search strategy</text>
  <text class="detail" x="82" y="239">random, CMA-ES,</text>
  <text class="detail" x="82" y="258">or MAP-Elites</text>
  <rect class="node" x="285" y="155" width="190" height="112" rx="10"/>
  <text class="number" x="307" y="183">02</text>
  <text class="label" x="307" y="213">Workload genome</text>
  <text class="detail" x="307" y="239">versioned parameters</text>
  <text class="detail" x="307" y="258">and seed</text>
  <rect class="node" x="510" y="155" width="190" height="112" rx="10"/>
  <text class="number" x="532" y="183">03</text>
  <text class="label" x="532" y="213">Runner</text>
  <text class="detail" x="532" y="239">local process or</text>
  <text class="detail" x="532" y="258">Kiln backend</text>
  <rect class="node" x="735" y="155" width="190" height="112" rx="10"/>
  <text class="number" x="757" y="183">04</text>
  <text class="label" x="757" y="213">Target adapter</text>
  <text class="detail" x="757" y="239">maps a genome to</text>
  <text class="detail" x="757" y="258">one target contract</text>
  <rect class="node" x="960" y="155" width="180" height="112" rx="10"/>
  <text class="number" x="982" y="183">05</text>
  <text class="label" x="982" y="213">Evidence</text>
  <text class="detail" x="982" y="239">observation, score,</text>
  <text class="detail" x="982" y="258">archive, checkpoint</text>
  <path class="flow" d="M250 211 H277"/>
  <path class="flow" d="M475 211 H502"/>
  <path class="flow" d="M700 211 H727"/>
  <path class="flow" d="M925 211 H952"/>
  <path class="return" d="M1050 279 V330 H155 V275"/>
  <text class="detail" x="470" y="361">The recorded result informs the next candidate.</text>
</svg>
